name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write
  actions: read
  checks: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artefacts
        uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --workspace --all-targets --all-features --locked

  test:
    name: cargo test
    needs: check
    # Pinned to 26.04 (preview until it becomes ubuntu-latest) for its
    # lcov 2.4 apt package — 24.04 ships lcov 2.0, whose `lcov --list`
    # is broken (see the install step below). Switch back to
    # ubuntu-latest once that label points at 26.04.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artefacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest + cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov

      - name: Run tests with coverage
        # `cargo llvm-cov nextest` runs the test suite under llvm-cov
        # instrumentation and still honours the `ci` nextest profile,
        # which writes target/nextest/ci/junit.xml. So one command
        # produces both the JUnit report AND lcov.info.
        # Don't fail the step on test failures — the publisher below
        # sees the JUnit report and decides the verdict via `fail_on_failure`.
        continue-on-error: true
        run: |
          cargo llvm-cov nextest \
            --workspace --all-features --profile ci \
            --lcov --output-path lcov.info

      - name: Fail if the test run produced no report
        # The coverage step is continue-on-error so that *test failures*
        # are reported by the JUnit publisher below (fail_on_failure).
        # But if the build breaks before nextest runs, no junit.xml (or
        # lcov.info) is ever written and every report step is skipped by
        # its hashFiles() guard, leaving the job green. Catch that case.
        if: always() && hashFiles('target/nextest/ci/junit.xml') == ''
        run: |
          echo "::error::cargo llvm-cov nextest exited without writing target/nextest/ci/junit.xml — it failed before any tests ran (build error?). See the 'Run tests with coverage' step."
          exit 1

      - name: Make lcov paths workspace-relative
        # cargo-llvm-cov writes absolute `SF:` paths
        # (/home/runner/work/<repo>/<repo>/...). zgosalvez compares each
        # PR-changed file (a repo-root-relative path it gets from the
        # listFiles API) against the lcov entries with a literal
        # startsWith and doesn't use its own working-directory input for
        # this — so without rewriting the prefix every changed file
        # mismatches and the PR comment shows
        # "Files changed coverage rate: n/a".
        if: always() && hashFiles('lcov.info') != ''
        run: sed -i "s|SF:${{ github.workspace }}/|SF:|g" lcov.info

      - name: Install lcov (genhtml)
        # Required by zgosalvez/github-actions-report-lcov to build the
        # HTML report — the action doesn't bundle lcov itself.
        # Needs lcov >= 2.1: lcov 2.0 (what 24.04's apt and the default
        # setup-lcov action install) has a broken `lcov --list` — the
        # per-file table (which the action uses for the "Files changed
        # coverage rate" section of the PR comment) prints the *hit*
        # count in the Num column and a nonsense Rate (e.g. 30.3%/0.0%
        # for a file genhtml reports as 97.2% lines / 97.6% functions).
        # 26.04 ships lcov 2.4, which is fine.
        if: always() && hashFiles('lcov.info') != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov

      - name: Shim lcov to restore the lcov 1.x output shape
        # zgosalvez's summarize() / detail() strip the first line of
        # lcov's stdout, assuming it's the legacy "Reading tracefile..."
        # banner from lcov 1.x, and detail() also strips the last two
        # lines, assuming they're the "Total:" row and its "====" rule.
        # lcov 2.4 prints the banner for --summary but still not for
        # --list, and appends a "Message summary:" block to both. Put a
        # shim earlier in PATH that prepends the banner for --list and
        # drops the trailing message block, so the action's line
        # stripping eats exactly what it expects.
        if: always() && hashFiles('lcov.info') != ''
        run: |
          LCOV_REAL=$(command -v lcov)
          mkdir -p "$RUNNER_TEMP/lcov-shim"
          cat > "$RUNNER_TEMP/lcov-shim/lcov" <<EOF
          #!/bin/bash
          case " \$* " in
            *" --list "*) echo "Reading tracefile..." ;;
          esac
          "$LCOV_REAL" "\$@" | sed '/^Message summary:/,\$d'
          exit "\${PIPESTATUS[0]}"
          EOF
          chmod +x "$RUNNER_TEMP/lcov-shim/lcov"
          echo "$RUNNER_TEMP/lcov-shim" >> "$GITHUB_PATH"

      - name: Summarise coverage
        if: always() && hashFiles('lcov.info') != ''
        id: coverage
        uses: zgosalvez/github-actions-report-lcov@v7
        with:
          coverage-files: lcov.info
          # Setting a non-empty artifact-name makes the action generate
          # the genhtml HTML report and upload it as a workflow artifact.
          artifact-name: coverage-html-report
          # Mikepenz's `summary:` input doesn't surface in its PR comment
          # (only in the job summary / check run), so let zgosalvez post
          # its own coverage comment. Artifact-id is produced by this
          # same step so we can't self-reference it — point at the run
          # page instead.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          update-comment: true
          additional-message: |
            [Download HTML report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Publish test report
        if: always() && hashFiles('target/nextest/ci/junit.xml') != ''
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: target/nextest/ci/junit.xml
          check_name: cargo test results
          # Fail the job on any failing test. Requires main to stay green.
          fail_on_failure: true
          require_tests: true
          detailed_summary: true
          comment: ${{ github.event_name == 'pull_request' }}
          summary: |
            **Coverage:** ${{ steps.coverage.outputs.total-coverage || 'n/a' }}% — [download HTML report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.coverage.outputs.artifact-id }})

  clippy:
    name: cargo clippy
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo build artefacts
        uses: Swatinem/rust-cache@v2

      # rs-clippy-check posts findings as GitHub Checks API annotations on
      # the commit, and fails the job on any clippy error. GitHub caps
      # Checks annotations at 10/type/run; the rest still appear in the
      # check summary.
      - name: Run clippy
        # `rs-clippy-check` only ships specific versions (no floating major
        # `v6` tag); pin to the latest release.
        uses: clechasseur/rs-clippy-check@v6.0.4
        with:
          args: --workspace --all-targets --all-features
