name: Benchmark

on:
  pull_request:
    paths:
      - 'core/**'
      - 'benchmarks/**'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  gungraun:
    name: gungraun (vs base)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GUNGRAUN_COLOR: never
      CARGO_TERM_COLOR: never
    steps:
      - name: Checkout PR (with base history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./benchmarks

      - name: Setup gungraun-runner and Valgrind
        uses: gungraun/setup-gungraun@v1
        with:
          # Keep this in sync with `benchmarks/Cargo.toml`'s `gungraun` dev-dep.
          runner-version: 0.19.2

      - name: Resolve PR base and head SHAs
        id: refs
        run: |
          echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"

      - name: Benchmark base ref (save baseline)
        id: baseline
        continue-on-error: true
        run: |
          git checkout "${{ steps.refs.outputs.base }}"
          if [ ! -f benchmarks/Cargo.toml ]; then
            echo "Base ref has no benchmarks/ crate; skipping baseline." >&2
            exit 1
          fi
          cargo bench --manifest-path benchmarks/Cargo.toml --bench fix_text -- \
            --save-baseline=base

      - name: Benchmark PR head (compare against baseline)
        run: |
          git checkout "${{ steps.refs.outputs.head }}"
          if [ "${{ steps.baseline.outcome }}" = "success" ]; then
            cargo bench --manifest-path benchmarks/Cargo.toml --bench fix_text -- \
              --baseline=base --save-summary=json | tee bench-output.txt
          else
            echo "No baseline available; running PR benchmarks standalone." | tee bench-output.txt
            cargo bench --manifest-path benchmarks/Cargo.toml --bench fix_text -- \
              --save-summary=json | tee -a bench-output.txt
          fi

      - name: Build summary table and comment body
        if: always() && hashFiles('bench-output.txt') != ''
        run: |
          set -euo pipefail

          # `benchmarks` is a member of the root Cargo workspace, so gungraun
          # writes its summaries under the workspace target at the repo root
          # (not under benchmarks/target/).
          mapfile -t summaries < <(find target/gungraun -type f -name summary.json 2>/dev/null | sort)

          # jq program: per gungraun's v6 schema, each summary file is a
          # BenchmarkSummary with metrics at
          #   profiles[i].summaries.parts[j].metrics_summary.Callgrind
          # — a MetricsSummary keyed by metric name (Ir, EstimatedCycles, …).
          # diff_pct is a stringified percentage (e.g. "-12.34" → -12.34%),
          # serialized as a string to preserve `inf`. We only surface the
          # delta — raw counts live in the full-output collapsible below.
          #
          # Colour thresholds (|Δ%|):
          #   <  NEGLIGIBLE_PCT      → plain text, no colour
          #   <  per-metric bold pct → coloured (green = faster, red = slower)
          #   >= per-metric bold pct → coloured AND bold
          # The bold cutoff matches that metric's soft-limit (declared in
          # benchmarks/benches/fix_text.rs) so bold ≡ "this is what failed
          # the job". Rendered via GitHub's KaTeX inline-math syntax, which
          # is the only way to get colour in a PR-comment markdown table.
          read -r -d '' JQ_PROG <<'JQ' || true
          def NEGLIGIBLE_PCT: 1.0;
          def fmt_pct(s; bold_pct):
            if s == null then "—"
            elif (s | tostring | test("inf"; "i")) then
              "$\\color{red}\\textbf{" + (s | tostring) + "}$"
            else
              (try (s | tonumber) catch null) as $n
              | if $n == null then (s | tostring)
                else
                  (if $n < 0 then -$n else $n end) as $abs
                  | (if $n > 0 then "+" else "" end) as $sign
                  | (($n * 100 | round) / 100) as $rounded
                  | ($sign + ($rounded | tostring)) as $num
                  | if $abs < NEGLIGIBLE_PCT then $num + "%"
                    elif $abs >= bold_pct then
                      (if $n > 0
                       then "$\\color{red}\\textbf{" + $num + "\\%}$"
                       else "$\\color{green}\\textbf{" + $num + "\\%}$" end)
                    else
                      (if $n > 0
                       then "$\\color{red}{" + $num + "\\%}$"
                       else "$\\color{green}{" + $num + "\\%}$" end)
                    end
                end
            end;
          . as $b
          | ($b.profiles[0].summaries.parts[0].metrics_summary.Callgrind // {}) as $ms
          | (
              ($b.module_path // "")
              + (if (($b.id // "") | tostring) != "" then " " + ($b.id|tostring) else "" end)
            ) as $name
          | "| `" + $name + "` | "
            + fmt_pct((($ms.Ir // {}).diffs // {}).diff_pct; 5.0) + " | "
            + fmt_pct((($ms.EstimatedCycles // {}).diffs // {}).diff_pct; 10.0) + " |"
          JQ

          {
            if [ "${{ steps.baseline.outcome }}" = "success" ]; then
              echo "## gungraun benchmark — PR vs \`${{ steps.refs.outputs.base }}\`"
            else
              echo "## gungraun benchmark (PR head only — no baseline)"
            fi
            echo
            if [ "${#summaries[@]}" -gt 0 ]; then
              echo "| Benchmark | ΔIr | ΔCycles |"
              echo "|---|---:|---:|"
              for f in "${summaries[@]}"; do
                jq -r "$JQ_PROG" "$f"
              done
              echo
              echo "<sub>Green = faster, red = slower. Bold marks a regression past the soft-limit threshold (Ir ≥ 5%, Cycles ≥ 10%); benchmark runs that breach the threshold fail the job.</sub>"
            else
              echo "_No \`summary.json\` files found under \`target/gungraun/\`._"
            fi
            echo
            echo "<details><summary>Full gungraun output</summary>"
            echo
            echo '```'
            cat bench-output.txt
            echo '```'
            echo
            echo "</details>"
          } > bench-body.md

      - name: Publish results to job summary
        if: always() && hashFiles('bench-body.md') != ''
        run: cat bench-body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post (or update) results comment on PR
        if: always() && github.event_name == 'pull_request' && hashFiles('bench-body.md') != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: gungraun-benchmark
          path: bench-body.md
