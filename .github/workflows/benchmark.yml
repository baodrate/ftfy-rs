name: Benchmark

on:
  pull_request:
    paths:
      - 'core/**'
      - 'benchmarks/**'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:
    # Thresholds — all values are |Δ%| relative to the base ref.
    # Defaults are the calibrated values from the initial measurement runs
    # (see the comment in benchmarks/benches/fix_text.rs).
    inputs:
      ir_fail_pct:
        description: 'Ir: fail the job (gungraun soft-limit)'
        type: number
        default: 1.0
      ir_bold_pct:
        description: 'Ir: bold the cell (significant change)'
        type: number
        default: 0.16
      ir_negligible_pct:
        description: 'Ir: leave the cell uncoloured (noise)'
        type: number
        default: 0.08
      cycles_fail_pct:
        description: 'Cycles: fail the job (gungraun soft-limit)'
        type: number
        default: 2.0
      cycles_bold_pct:
        description: 'Cycles: bold the cell (significant change)'
        type: number
        default: 1.0
      cycles_negligible_pct:
        description: 'Cycles: leave the cell uncoloured (noise)'
        type: number
        default: 0.5

permissions:
  contents: read
  pull-requests: write

jobs:
  gungraun:
    name: gungraun (vs base)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GUNGRAUN_COLOR: never
      CARGO_TERM_COLOR: never
      # inputs.X is only set on workflow_dispatch; pull_request falls back to
      # the defaults above. Keep in sync with workflow_dispatch.inputs and the
      # in-code soft_limits in benchmarks/benches/fix_text.rs.
      IR_FAIL_PCT:           ${{ inputs.ir_fail_pct           || '1.0'  }}
      IR_BOLD_PCT:           ${{ inputs.ir_bold_pct           || '0.16' }}
      IR_NEGLIGIBLE_PCT:     ${{ inputs.ir_negligible_pct     || '0.08' }}
      CYCLES_FAIL_PCT:       ${{ inputs.cycles_fail_pct       || '2.0'  }}
      CYCLES_BOLD_PCT:       ${{ inputs.cycles_bold_pct       || '1.0'  }}
      CYCLES_NEGLIGIBLE_PCT: ${{ inputs.cycles_negligible_pct || '0.5'  }}
    steps:
      - name: Checkout PR (with base history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artefacts
        uses: Swatinem/rust-cache@v2

      - name: Setup gungraun-runner and Valgrind
        uses: gungraun/setup-gungraun@v1
        with:
          # Keep this in sync with `benchmarks/Cargo.toml`'s `gungraun` dev-dep.
          runner-version: 0.19.2

      - name: Resolve PR base and head SHAs
        id: refs
        run: |
          echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"

      - name: Benchmark base ref (save baseline)
        id: baseline
        continue-on-error: true
        run: |
          git checkout "${{ steps.refs.outputs.base }}"
          if [ ! -f benchmarks/Cargo.toml ]; then
            echo "Base ref has no benchmarks/ crate; skipping baseline." >&2
            exit 1
          fi
          cargo bench -p plsfix-benchmarks -- \
            --save-baseline=base

      - name: Benchmark PR head (compare against baseline)
        id: head
        # Gungraun's soft_limits make this exit non-zero on regression;
        # continue-on-error lets the comment/artefacts still post and the job
        # fails at the end. GUNGRAUN_CALLGRIND_LIMITS overrides the in-code
        # soft_limits with this file's thresholds (single source of truth).
        continue-on-error: true
        env:
          GUNGRAUN_CALLGRIND_LIMITS: "Ir=${{ env.IR_FAIL_PCT }}%,EstimatedCycles=${{ env.CYCLES_FAIL_PCT }}%"
        run: |
          # pipefail so `cargo bench | tee` surfaces gungraun's non-zero exit
          # (the signal steps.head.outcome uses to fail the job).
          set -o pipefail
          git checkout "${{ steps.refs.outputs.head }}"
          if [ "${{ steps.baseline.outcome }}" = "success" ]; then
            cargo bench -p plsfix-benchmarks -- \
              --baseline=base --save-summary=json | tee bench-output.txt
          else
            echo "No baseline available; running PR benchmarks standalone." | tee bench-output.txt
            cargo bench -p plsfix-benchmarks -- \
              --save-summary=json | tee -a bench-output.txt
          fi

      - name: Upload gungraun artefacts (summaries + flamegraphs)
        id: artefacts
        if: always() && hashFiles('target/gungraun/**/summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gungraun-${{ github.event.pull_request.number || github.run_id }}
          path: |
            target/gungraun/**/*.svg
            target/gungraun/**/summary.json
            target/gungraun/**/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Build summary table and comment body
        if: always() && hashFiles('bench-output.txt') != ''
        run: |
          set -euo pipefail

          # `benchmarks` is a member of the root Cargo workspace, so gungraun
          # writes its summaries under the workspace target at the repo root
          # (not under benchmarks/target/).
          mapfile -t summaries < <(find target/gungraun -type f -name summary.json 2>/dev/null | sort)

          # jq program: per gungraun's v6 schema each summary is a
          # BenchmarkSummary with Callgrind metrics at
          #   profiles[0].summaries.parts[0].metrics_summary.Callgrind
          # keyed by metric name (Ir, EstimatedCycles, …). diff_pct is a
          # stringified percent (string-typed to preserve `inf`); we surface
          # only the delta, raw counts go in the collapsible below.
          #
          # Cycles thresholds run ~6× looser than Ir: Callgrind cycle counts
          # model cache behaviour and shift ±0.2% on code layout alone. Bold
          # sits between the noise band and the fail soft-limit, and colours
          # the cell via GitHub's KaTeX inline-math (the only way to colour a
          # table cell). Thresholds come from the job env vars (single source
          # of truth), which jq reads straight from env.
          read -r -d '' JQ_PROG <<'JQ' || true
          # Signed fixed two-decimal string (1 → "+1.00", -1.04 → "-1.04").
          # jq's tostring strips trailing zeros, so work in cents (×100),
          # pad to 3 digits, and insert the decimal point.
          def fmt2($x):
            (($x * 100) | round) as $c
            | (if $c < 0 then "-" elif $c > 0 then "+" else "" end) as $sg
            | (if $c < 0 then -$c else $c end | tostring) as $abs_s
            | (if ($abs_s | length) < 3 then ("00" + $abs_s)[-3:] else $abs_s end) as $padded
            | $sg + ($padded | sub("(?<f>\\d\\d)$"; ".\(.f)"));
          def fmt_pct(s; negligible_pct; bold_pct):
            if s == null then "—"
            elif (s | tostring | test("inf"; "i")) then
              "⚠️ **\(s | tostring)**"
            else
              (try (s | tonumber) catch null) as $n
              | if $n == null then (s | tostring)
                else
                  (if $n < 0 then -$n else $n end) as $abs
                  | (if $n > 0 then "⚠️" else "✅" end) as $emoji
                  | (($n * 100 | round) / 100) as $rounded
                  # When |Δ| rounds to 0.00 at two decimals, "+0%" reads
                  # as "exactly nothing changed" which the diff_pct rarely
                  # is — so show "≈0%" to make the rounding explicit.
                  | (if $rounded == 0 then "≈0" else fmt2($rounded) end) as $num
                  | if $abs < negligible_pct then "\($num)%"
                    else
                      (if $abs >= bold_pct then "**\($num)%**" else "\($num)%" end)
                      | "\($emoji) \(.)"
                    end
                end
            end;
          (env.IR_NEGLIGIBLE_PCT     | tonumber) as $ir_neg  |
          (env.IR_BOLD_PCT           | tonumber) as $ir_bold |
          (env.CYCLES_NEGLIGIBLE_PCT | tonumber) as $cy_neg  |
          (env.CYCLES_BOLD_PCT       | tonumber) as $cy_bold |
          . as $b
          | ($b.profiles[0].summaries.parts[0].metrics_summary.Callgrind // {}) as $ms
          # `function_name id` reads cleanly in the table (e.g. `cold clean`)
          # — the full `module_path` (file::group::fn) duplicates context the
          # comment header already states.
          | (
              ($b.function_name // "")
              + (if (($b.id // "") | tostring) != "" then " " + ($b.id|tostring) else "" end)
            ) as $name
          | "| `" + $name + "` | "
            + fmt_pct((($ms.Ir // {}).diffs // {}).diff_pct; $ir_neg; $ir_bold) + " | "
            + fmt_pct((($ms.EstimatedCycles // {}).diffs // {}).diff_pct; $cy_neg; $cy_bold) + " |"
          JQ

          PR_NUM='${{ github.event.pull_request.number }}'
          BASE_REF='${{ github.event.pull_request.base.ref }}'
          ARTEFACT_URL='${{ steps.artefacts.outputs.artifact-url }}'

          {
            if [ "${{ steps.baseline.outcome }}" = "success" ]; then
              if [ -n "$PR_NUM" ]; then
                echo "### gungraun benchmark — PR-${PR_NUM} vs \`${BASE_REF}\`"
              else
                echo "### gungraun benchmark — head vs \`${BASE_REF:-base}\`"
              fi
            else
              echo "### gungraun benchmark (PR head only — no baseline)"
            fi
            echo
            if [ "${#summaries[@]}" -gt 0 ]; then
              echo "| Benchmark | ΔIr | ΔCycles |"
              echo "|---|---:|---:|"
              for f in "${summaries[@]}"; do
                jq -r "$JQ_PROG" "$f"
              done
            else
              echo "_No \`summary.json\` files found under \`target/gungraun/\`._"
            fi
            echo
            if [ -n "$ARTEFACT_URL" ]; then
              echo "Differential flamegraphs and raw summaries: [download artefact](${ARTEFACT_URL})"
              echo
            fi
            echo "<details><summary>Full gungraun output</summary>"
            echo
            echo '```'
            cat bench-output.txt
            echo '```'
            echo
            echo "</details>"
          } > bench-body.md

      - name: Publish results to job summary
        if: always() && hashFiles('bench-body.md') != ''
        run: cat bench-body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post (or update) results comment on PR
        # `benchmark` section of the shared comment; ci.yml writes `ci`.
        if: always() && github.event_name == 'pull_request' && hashFiles('bench-body.md') != ''
        uses: ./.github/actions/pr-comment-section
        with:
          section: benchmark
          path: bench-body.md

      - name: Fail job if the benchmark regressed
        if: always() && steps.head.outcome == 'failure'
        run: |
          echo "::error::gungraun detected a benchmark regression past the configured soft-limit."
          exit 1
