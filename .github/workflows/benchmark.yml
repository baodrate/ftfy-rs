name: Benchmark

on:
  pull_request:
    paths:
      - 'core/**'
      - 'benchmarks/**'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  gungraun:
    name: gungraun (vs base)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GUNGRAUN_COLOR: never
      CARGO_TERM_COLOR: never
    steps:
      - name: Checkout PR (with base history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./benchmarks

      - name: Setup gungraun-runner and Valgrind
        uses: gungraun/setup-gungraun@v1
        with:
          # Keep this in sync with `benchmarks/Cargo.toml`'s `gungraun` dev-dep.
          runner-version: 0.19.2

      - name: Resolve PR base and head SHAs
        id: refs
        run: |
          echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"

      - name: Benchmark base ref (save baseline)
        id: baseline
        continue-on-error: true
        run: |
          git checkout "${{ steps.refs.outputs.base }}"
          if [ ! -f benchmarks/Cargo.toml ]; then
            echo "Base ref has no benchmarks/ crate; skipping baseline." >&2
            exit 1
          fi
          cargo bench --manifest-path benchmarks/Cargo.toml --bench fix_text -- \
            --save-baseline=base

      - name: Benchmark PR head (compare against baseline)
        id: head
        # Gungraun's soft_limits (declared in benchmarks/benches/fix_text.rs)
        # make this step exit non-zero on regression. `continue-on-error` lets
        # downstream steps still post the diff comment / artefacts; the job is
        # marked failed at the end so CI signals the regression.
        continue-on-error: true
        run: |
          git checkout "${{ steps.refs.outputs.head }}"
          if [ "${{ steps.baseline.outcome }}" = "success" ]; then
            cargo bench --manifest-path benchmarks/Cargo.toml --bench fix_text -- \
              --baseline=base --save-summary=json | tee bench-output.txt
          else
            echo "No baseline available; running PR benchmarks standalone." | tee bench-output.txt
            cargo bench --manifest-path benchmarks/Cargo.toml --bench fix_text -- \
              --save-summary=json | tee -a bench-output.txt
          fi

      - name: Upload gungraun artefacts (summaries + flamegraphs)
        id: artefacts
        if: always() && hashFiles('target/gungraun/**/summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gungraun-${{ github.event.pull_request.number || github.run_id }}
          path: |
            target/gungraun/**/*.svg
            target/gungraun/**/summary.json
            target/gungraun/**/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Build summary table and comment body
        if: always() && hashFiles('bench-output.txt') != ''
        run: |
          set -euo pipefail

          # `benchmarks` is a member of the root Cargo workspace, so gungraun
          # writes its summaries under the workspace target at the repo root
          # (not under benchmarks/target/).
          mapfile -t summaries < <(find target/gungraun -type f -name summary.json 2>/dev/null | sort)

          # jq program: per gungraun's v6 schema, each summary file is a
          # BenchmarkSummary with metrics at
          #   profiles[i].summaries.parts[j].metrics_summary.Callgrind
          # — a MetricsSummary keyed by metric name (Ir, EstimatedCycles, …).
          # `diff_pct` is a stringified percentage (e.g. "-12.34" → -12.34%),
          # serialized as a string to preserve `inf`. We only surface the
          # delta — raw counts live in the full-output collapsible below.
          #
          # Thresholds were calibrated by re-running the bench against itself
          # (noise floor) and against tiny / large injected slowdowns:
          #
          #   Ir noise on identical code  ≤ 0.0005%
          #   Ir from one-shot black_box  ≤ 0.0003%      (still noise)
          #   Ir from per-byte fold once  0.06 – 0.23%   (real, small)
          #   Ir from 50× per-byte fold   2.96 – 11.46%  (fails build)
          #
          # Callgrind cycle counts fold in cache modelling, which is *much*
          # more sensitive to code layout: an inert black_box shifted cycles
          # by ±0.2% with zero perf change. Cycles thresholds are therefore
          # ~6× looser than Ir to stay above that layout-noise floor.
          #
          # The bold cut-off matches that metric's gungraun soft-limit (see
          # benchmarks/benches/fix_text.rs), so bold ≡ "this is the regression
          # that failed the job". Rendered via GitHub's KaTeX inline-math
          # syntax, the only way to colour cells inside a PR-comment table.
          read -r -d '' JQ_PROG <<'JQ' || true
          def fmt_pct(s; negligible_pct; bold_pct):
            if s == null then "—"
            elif (s | tostring | test("inf"; "i")) then
              "$\\color{red}\\textbf{" + (s | tostring) + "}$"
            else
              (try (s | tonumber) catch null) as $n
              | if $n == null then (s | tostring)
                else
                  (if $n < 0 then -$n else $n end) as $abs
                  | (if $n > 0 then "+" else "" end) as $sign
                  | (($n * 100 | round) / 100) as $rounded
                  # When |Δ| rounds to 0.00 at two decimals, "+0%" reads as
                  # "exactly nothing changed" which the diff_pct rarely is —
                  # so show "≈0%" to make the rounding explicit.
                  | (if $rounded == 0
                     then "≈0%"
                     else $sign + ($rounded | tostring) + "%" end) as $num_plain
                  | (if $rounded == 0
                     then "≈0"
                     else $sign + ($rounded | tostring) end) as $num_math
                  | if $abs < negligible_pct then $num_plain
                    elif $abs >= bold_pct then
                      (if $n > 0
                       then "$\\color{red}\\textbf{" + $num_math + "\\%}$"
                       else "$\\color{green}\\textbf{" + $num_math + "\\%}$" end)
                    else
                      (if $n > 0
                       then "$\\color{red}{" + $num_math + "\\%}$"
                       else "$\\color{green}{" + $num_math + "\\%}$" end)
                    end
                end
            end;
          . as $b
          | ($b.profiles[0].summaries.parts[0].metrics_summary.Callgrind // {}) as $ms
          # `function_name id` reads cleanly in the table (e.g. `cold clean`)
          # — the full `module_path` (file::group::fn) duplicates context the
          # comment header already states.
          | (
              ($b.function_name // "")
              + (if (($b.id // "") | tostring) != "" then " " + ($b.id|tostring) else "" end)
            ) as $name
          | "| `" + $name + "` | "
            + fmt_pct((($ms.Ir // {}).diffs // {}).diff_pct; 0.08; 0.16) + " | "
            + fmt_pct((($ms.EstimatedCycles // {}).diffs // {}).diff_pct; 0.5; 1.0) + " |"
          JQ

          PR_NUM='${{ github.event.pull_request.number }}'
          BASE_REF='${{ github.event.pull_request.base.ref }}'
          ARTEFACT_URL='${{ steps.artefacts.outputs.artifact-url }}'

          {
            if [ "${{ steps.baseline.outcome }}" = "success" ]; then
              if [ -n "$PR_NUM" ]; then
                echo "## gungraun benchmark — PR-${PR_NUM} vs \`${BASE_REF}\`"
              else
                echo "## gungraun benchmark — head vs \`${BASE_REF:-base}\`"
              fi
            else
              echo "## gungraun benchmark (PR head only — no baseline)"
            fi
            echo
            if [ "${#summaries[@]}" -gt 0 ]; then
              echo "| Benchmark | ΔIr | ΔCycles |"
              echo "|---|---:|---:|"
              for f in "${summaries[@]}"; do
                jq -r "$JQ_PROG" "$f"
              done
              echo
              echo "<sub>Green = faster, red = slower. **Bold** marks a regression past the soft-limit threshold (Ir ≥ 1%, Cycles ≥ 2%), which fails the job. Δ% under 0.08% (Ir) / 0.5% (Cycles) is treated as noise and left uncoloured.</sub>"
            else
              echo "_No \`summary.json\` files found under \`target/gungraun/\`._"
            fi
            echo
            if [ -n "$ARTEFACT_URL" ]; then
              echo "Differential flamegraphs and raw summaries: [download artefact](${ARTEFACT_URL})"
              echo
            fi
            echo "<details><summary>Full gungraun output</summary>"
            echo
            echo '```'
            cat bench-output.txt
            echo '```'
            echo
            echo "</details>"
          } > bench-body.md

      - name: Publish results to job summary
        if: always() && hashFiles('bench-body.md') != ''
        run: cat bench-body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post (or update) results comment on PR
        if: always() && github.event_name == 'pull_request' && hashFiles('bench-body.md') != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: gungraun-benchmark
          path: bench-body.md

      - name: Fail job if the benchmark regressed
        if: always() && steps.head.outcome == 'failure'
        run: |
          echo "::error::gungraun detected a benchmark regression past the configured soft-limit."
          exit 1
