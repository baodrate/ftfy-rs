[build-system]
requires = ["maturin>=1.3,<2.0"]
build-backend = "maturin"

[project]
name = "plsfix"
description = "Fixes mojibake and other glitches in Unicode text, after the fact."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]

[tool.maturin]
features = ["pyo3/extension-module"]

[tool.uv]
# Don't let uv build/install plsfix itself; `maturin develop` handles the
# extension module. uv only manages the dev environment (see [dependency-groups]).
package = false

[dependency-groups]
dev = ["maturin>=1.3,<2.0"]
